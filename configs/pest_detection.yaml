# Distillation config for the pest detection use case
# (aspilanta-fewshot-detection → edge student)

teacher: yolov8s.pt          # path or model name
student: yolov8n.pt          # smaller student

data: data/pest.yaml         # YOLO dataset YAML

# Training
epochs: 50
lr: 0.0001
batch: 8
imgsz: 640
device: cpu                  # 'cpu' | 'cuda' | '0'

# Loss weights
lambda_det: 1.0              # supervised detection loss weight
lambda_kd: 0.5               # knowledge distillation loss weight
temperature: 4.0             # soft-label KD temperature

# Quantization
ptq_calibration_batches: 50
qat_epochs: 10
qat_lr_factor: 0.1           # QAT LR = lr * qat_lr_factor
quant_backend: fbgemm         # 'fbgemm' (x86) or 'qnnpack' (ARM/edge)

# Export
export_onnx: true
onnx_opset: 17
onnx_input_shape: [1, 3, 640, 640]

# Output
out_dir: runs/distill_pest
