# Distillation config — pest detection (Aspilanta + eu_moth)
# Trained on Tesla T4 GPU | 30 epochs
#
# Results:
#   Teacher (YOLOv8s): mAP@50=0.9727  mAP@50-95=0.7753  FPS=58.5   Size=21.47MB
#   Student (YOLOv8n): mAP@50=0.9615  mAP@50-95=0.7366  FPS=120.9  Size=6.2MB
#   Compression: 3.46× smaller, 2.07× faster

teacher: yolov8s.pt          # 21.47 MB, 11.13M params
student: yolov8n.pt          #  6.20 MB,  3.13M params

data: configs/pest_detection.yaml   # update to your dataset YAML path

# Dataset
nc: 2
names:
  0: Aspilanta
  1: eu_moth

# Training
epochs: 30
lr: 0.0001
batch: 16
imgsz: 640
device: "0"                  # 'cpu' | '0' (GPU)

# Loss weights
lambda_det: 1.0              # supervised detection loss weight
lambda_kd: 0.5               # knowledge distillation loss weight
temperature: 4.0             # soft-label KD temperature (Hinton 2015)

# Quantization
ptq_calibration_batches: 50
quant_backend: fbgemm         # 'fbgemm' (x86) or 'qnnpack' (ARM/edge)
# Note: QAT skipped (--skip-qat) — per_channel_affine incompatibility
# on PyTorch 2.x + CUDA. PTQ used instead.

# Export
export_onnx: true
onnx_opset: 18               # opset 18 — Ultralytics default, TensorRT-compatible

# Output
out_dir: runs/distill_pest
