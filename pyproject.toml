[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov8-edge-distillation"
version = "0.1.0"
description = "Knowledge distillation + INT8 quantization pipeline for YOLOv8 edge deployment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "torchmetrics>=1.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
train = [
    "ultralytics>=8.1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
dev = ["pytest>=7.0", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["distill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
