[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "yolov8-edge-distillation"
version = "0.1.0"
description = "Knowledge distillation + INT8 quantization pipeline for YOLOv8 edge deployment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

# Core deps only — torch/torchvision intentionally excluded here
# because they require platform-specific index URLs.
# Install separately: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "torchmetrics>=1.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
# Full training pipeline — includes Ultralytics for YOLO model management
train = [
    "ultralytics>=8.1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
dev = ["pytest>=7.0", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
